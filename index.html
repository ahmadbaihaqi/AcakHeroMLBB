<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Legends Hero Roulette</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }
        .hero-card-glow {
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.3);
        }
        .hero-avatar {
            width: 96px;
            height: 96px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.75rem;
            color: #fff;
            border: 3px solid rgba(234,179,8,0.6);
            box-shadow: 0 0 20px rgba(0,0,0,0.35);
            overflow: hidden;
            margin: 0 auto;
            background-color: #1e293b;
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .role-tag {
            display: inline-block;
            margin: 0 2px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-6">

    <header class="text-center my-4">
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 uppercase drop-shadow-lg">
            MLBB Hero Roulette
        </h1>
        <p class="text-sm md:text-base text-gray-300 mt-1">Pilih hero andalanmu secara acak untuk mabar atau challenge!</p>
    </header>

    <main class="w-full max-w-2xl bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-6 md:p-8 glow-effect flex flex-col items-center">

        <div class="w-full mb-6">
            <label class="block text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">Pilih Role:</label>
            <div id="role-filters" class="grid grid-cols-3 sm:grid-cols-7 gap-2">
                <button onclick="setRole('All')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition-all active:scale-95 shadow-md" data-role="All">Semua</button>
                <button onclick="setRole('Tank')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Tank">Tank</button>
                <button onclick="setRole('Fighter')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Fighter">Fighter</button>
                <button onclick="setRole('Assassin')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Assassin">Assassin</button>
                <button onclick="setRole('Mage')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Mage">Mage</button>
                <button onclick="setRole('Marksman')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Marksman">MM</button>
                <button onclick="setRole('Support')" class="role-btn px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all active:scale-95" data-role="Support">Support</button>
            </div>
        </div>

        <div class="w-full h-56 md:h-64 bg-gradient-to-b from-slate-950 to-slate-900 border-2 border-slate-700 rounded-xl flex flex-col items-center justify-center relative overflow-hidden mb-4 hero-card-glow">
            <div id="hero-display" class="text-center transition-all duration-75">
                <div id="hero-avatar" class="hero-avatar mb-2">?</div>
                <h2 id="hero-name" class="text-2xl md:text-4xl font-extrabold tracking-wide text-yellow-400">Tekan Tombol Spin!</h2>
                <span id="hero-role" class="inline-block mt-2 px-3 py-1 text-xs font-semibold bg-slate-800 text-gray-400 rounded-full border border-slate-700">Role: -</span>
            </div>
        </div>

        <p id="pool-status" class="text-xs text-gray-400 mb-4">Sisa pool: -</p>

        <div class="w-full flex flex-col sm:flex-row gap-3">
            <button id="spin-btn" onclick="spinHero()" class="flex-1 py-4 bg-gradient-to-r from-yellow-500 via-amber-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-slate-950 font-black text-lg md:text-xl rounded-xl tracking-wider uppercase shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-all cursor-pointer">
                Gacha Hero Sekarang!
            </button>
            <button id="reset-btn" onclick="resetPool()" class="sm:w-auto px-5 py-4 bg-slate-800 hover:bg-slate-700 text-gray-200 font-bold text-sm rounded-xl border border-slate-600 active:scale-[0.98] transition-all cursor-pointer">
                Reset Pool
            </button>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-500 my-4">
        <p>Mobile Legends Hero Roulette &bull; Dibuat dengan Tailwind CSS</p>
        <p class="mt-1">Ikon hero &copy; Moonton, diambil dari Mobile Legends Bang Bang Wiki (Fandom)</p>
    </footer>

        const STORAGE_KEY = 'mlbb_roulette_pools_v2';
        let selectedRole = 'All';
        let isSpinning = false;
        let storageAvailable = true;
        let memoryPools = {};

        function testStorage() {
            try {
                const k = '__mlbb_test__';
                localStorage.setItem(k, '1');
                localStorage.removeItem(k);
                return true;
            } catch (e) {
                return false;
            }
        }
        storageAvailable = testStorage();

        function loadPools() {
            if (!storageAvailable) return memoryPools;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function savePools(pools) {
            if (!storageAvailable) {
                memoryPools = pools;
                return;
            }
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(pools));
            } catch (e) {
                storageAvailable = false;
                memoryPools = pools;
            }
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getHeroesByRole(role) {
            return role === 'All' ? heroes : heroes.filter(h => h.roles.includes(role));
        }

        function ensurePool(role) {
            const pools = loadPools();
            if (!pools[role] || pools[role].length === 0) {
                pools[role] = shuffle(getHeroesByRole(role).map(h => h.name));
                savePools(pools);
            }
            return pools[role];
        }

        function updatePoolStatusDisplay() {
            const pools = loadPools();
            const total = getHeroesByRole(selectedRole).length;
            const remaining = (pools[selectedRole] && pools[selectedRole].length) || 0;
            const el = document.getElementById('pool-status');
            if (remaining === 0) {
                el.innerText = `Sisa pool: 0/${total} \u2014 pool kosong, klik "Reset Pool" untuk mengacak ulang.`;
            } else {
                el.innerText = `Sisa pool: ${remaining}/${total} hero belum muncul.`;
            }
            if (!storageAvailable) {
                el.innerText += ' (penyimpanan browser tidak tersedia, pool hanya bertahan selama sesi ini)';
            }
        }

        function renderAvatar(hero) {
            const avatarEl = document.getElementById('hero-avatar');
            if (hero.icon) {
                avatarEl.innerHTML = `<img src="${hero.icon}" alt="${hero.name}">`;
            } else {
                avatarEl.innerHTML = hero.name.slice(0, 2).toUpperCase();
            }
        }

        function setRole(role) {
            if (isSpinning) return;
            selectedRole = role;

            document.querySelectorAll('.role-btn').forEach(btn => {
                if (btn.getAttribute('data-role') === role) {
                    btn.classList.remove('bg-slate-800', 'text-gray-300');
                    btn.classList.add('bg-purple-600', 'text-white');
                } else {
                    btn.classList.remove('bg-purple-600', 'text-white');
                    btn.classList.add('bg-slate-800', 'text-gray-300');
                }
            });

            ensurePool(role);
            updatePoolStatusDisplay();
        }

        function resetPool() {
            if (isSpinning) return;
            const pools = loadPools();
            pools[selectedRole] = shuffle(getHeroesByRole(selectedRole).map(h => h.name));
            savePools(pools);
            updatePoolStatusDisplay();
        }

        function spinHero() {
            if (isSpinning) return;

            const filteredHeroes = getHeroesByRole(selectedRole);
            if (filteredHeroes.length === 0) {
                alert("Tidak ada hero dalam role ini!");
                return;
            }

            let pool = ensurePool(selectedRole);
            if (pool.length === 0) {
                alert('Pool untuk role ini sudah habis! Klik "Reset Pool" untuk mengacak ulang.');
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            const heroNameEl = document.getElementById('hero-name');
            const heroRoleEl = document.getElementById('hero-role');

            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let counter = 0;
            const totalSteps = 25;
            let delay = 50;

            function runSpin() {
                const randomIndex = Math.floor(Math.random() * filteredHeroes.length);
                const currentHero = filteredHeroes[randomIndex];

                heroNameEl.innerText = currentHero.name;
                heroRoleEl.innerText = `Role: ${currentHero.roles.join(' / ')}`;
                renderAvatar(currentHero);

                counter++;
                if (counter < totalSteps) {
                    delay += 15;
                    setTimeout(runSpin, delay);
                } else {
                    const pools = loadPools();
                    const currentPool = pools[selectedRole];
                    const pickIndex = Math.floor(Math.random() * currentPool.length);
                    const finalHeroName = currentPool[pickIndex];
                    const finalHero = heroes.find(h => h.name === finalHeroName) || filteredHeroes[0];

                    heroNameEl.innerText = finalHero.name;
                    heroRoleEl.innerText = `Role: ${finalHero.roles.join(' / ')}`;
                    renderAvatar(finalHero);

                    pools[selectedRole] = currentPool.filter(n => n !== finalHeroName);
                    savePools(pools);
                    updatePoolStatusDisplay();

                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            runSpin();
        }

        ensurePool(selectedRole);
        updatePoolStatusDisplay();
    </script>
